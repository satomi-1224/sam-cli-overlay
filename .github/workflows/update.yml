name: Update aws-sam-cli

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check latest version on PyPI
        id: pypi
        run: |
          LATEST=$(curl -fsSL https://pypi.org/pypi/aws-sam-cli/json | jq -r '.info.version')
          CURRENT=$(jq -r '.version' version.json)
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}, current=${CURRENT}"

      - name: Update version.json
        if: steps.pypi.outputs.latest != steps.pypi.outputs.current
        run: |
          VERSION="${{ steps.pypi.outputs.latest }}"
          URL=$(curl -fsSL "https://pypi.org/pypi/aws-sam-cli/${VERSION}/json" \
            | jq -r '.urls[] | select(.filename | endswith(".tar.gz")) | .url')
          HASH=$(python3 - <<EOF
          import urllib.request, hashlib, base64
          url = "${URL}"
          data = urllib.request.urlopen(url).read()
          h = hashlib.sha256(data).digest()
          print("sha256-" + base64.b64encode(h).decode())
          EOF
          )
          jq -n --arg v "$VERSION" --arg h "$HASH" \
            '{"version": $v, "hash": $h}' > version.json

      - uses: peter-evans/create-pull-request@v7
        id: create-pr
        if: steps.pypi.outputs.latest != steps.pypi.outputs.current
        with:
          commit-message: "chore: update aws-sam-cli to ${{ steps.pypi.outputs.latest }}"
          title: "chore: update aws-sam-cli to ${{ steps.pypi.outputs.latest }}"
          body: |
            Automated update from PyPI.

            - ${{ steps.pypi.outputs.current }} → ${{ steps.pypi.outputs.latest }}
            - [Release notes](https://github.com/aws/aws-sam-cli/releases/tag/v${{ steps.pypi.outputs.latest }})
          branch: auto-update/aws-sam-cli
          delete-branch: true

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.create-pr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
